services:

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: clubpal-db
    environment:
      POSTGRES_USER: clubpal
      POSTGRES_PASSWORD: clubpal
      POSTGRES_DB: clubpal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/pg-init:/docker-entrypoint-initdb.d:ro
    networks:
      - clubpal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubpal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Garage config writer — alpine init container; writes garage.toml to a
  # shared volume so the scratch-based Garage image can read it.
  # ===========================================
  garage-config-writer:
    image: alpine:3.19
    container_name: clubpal-garage-config-writer
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-dev-rpc-secret-clubpal-replace-me-32c}
    volumes:
      - garage_cfg:/cfg
    command:
      - /bin/sh
      - -c
      - >-
        printf 'metadata_dir = "/var/lib/garage/meta"\ndata_dir = "/var/lib/garage/data"\nreplication_factor = 1\nrpc_bind_addr = "0.0.0.0:3901"\nrpc_public_addr = "garage:3901"\nrpc_secret = "%s"\n\n[s3_api]\ns3_region = "garage"\napi_bind_addr = "0.0.0.0:3900"\nroot_domain = ".s3.localhost"\n\n[s3_web]\nbind_addr = "0.0.0.0:3902"\nroot_domain = ".web.localhost"\nindex = "index.html"\n\n[admin]\napi_bind_addr = "0.0.0.0:3903"\n' "$GARAGE_RPC_SECRET" > /cfg/garage.toml && echo "Config written"
    networks:
      - clubpal-network
    restart: "no"

  # ===========================================
  # Garage — S3-compatible object storage (scratch image — no shell/curl)
  # API (S3): internal port 3900, via nginx /storage/
  # Admin API: internal port 3903 (setup only)
  # ===========================================
  garage:
    image: dxflrs/garage:v1.0.0
    container_name: clubpal-garage
    entrypoint: ["/garage", "-c", "/cfg/garage.toml", "server"]
    volumes:
      - garage_cfg:/cfg
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - clubpal-network
    depends_on:
      garage-config-writer:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/garage", "-c", "/cfg/garage.toml", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Init container — lays out cluster, creates key + buckets
  garage-setup:
    image: python:3.12-alpine
    container_name: clubpal-garage-setup
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - clubpal-network
    environment:
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-clubpal}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:-clubpalpassword}
    entrypoint: >
      /bin/sh -c "
      pip install requests -q &&
      python3 -c \"
      import os, time, requests, sys
      ADMIN = 'http://garage:3903'
      KEY = os.environ['GARAGE_ACCESS_KEY']
      SECRET = os.environ['GARAGE_SECRET_KEY']
      for i in range(30):
          try:
              if requests.get(f'{ADMIN}/health', timeout=2).status_code == 200: break
          except: pass
          time.sleep(2)
      else:
          print('Garage not ready', file=sys.stderr); sys.exit(1)
      status = requests.get(f'{ADMIN}/v1/status').json()
      node_id = next(iter(status.get('nodes', {})), None)
      if not node_id:
          print('No nodes found', file=sys.stderr); sys.exit(1)
      print(f'Node: {node_id}')
      requests.post(f'{ADMIN}/v1/layout', json={node_id: {'zone': 'dc1', 'capacity': 10000000000}})
      layout = requests.get(f'{ADMIN}/v1/layout').json()
      version = layout.get('version', 0) + 1
      requests.post(f'{ADMIN}/v1/layout/apply', json={'version': version})
      r = requests.post(f'{ADMIN}/v1/key', json={'name': 'main', 'importKeyId': KEY, 'importSecretKey': SECRET})
      print(f'Key: {r.status_code}')
      for name in ['clubpal-avatars', 'clubpal-events', 'clubpal-cache']:
          r = requests.post(f'{ADMIN}/v1/bucket', json={'globalAlias': name})
          bid = r.json().get('id') or requests.get(f'{ADMIN}/v1/bucket', params={'globalAlias': name}).json()['id']
          requests.post(f'{ADMIN}/v1/bucket/allow', json={'bucketId': bid, 'accessKeyId': KEY, 'read': True, 'write': True, 'owner': True})
          print(f'Bucket {name} ready')
      print('Done')
      \""
    restart: on-failure

  # ===========================================
  # Nginx — Web UI + API Reverse Proxy
  # Single public port: 9000 → 80
  # ===========================================
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: clubpal-nginx
    ports:
      - "9000:80"
    volumes:
      - ./nginx/logs:/var/log/nginx
    networks:
      - clubpal-network
    depends_on:
      - api-gateway
      - groups-service
      - events-service
      - ratings-service
      - activities-service
      - enrichment-service
      - bill-split-service
      - garage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================
  # API Gateway — Auth, Users, Invites
  # ===========================================
  api-gateway:
    build: ./backend/services/api-gateway
    container_name: clubpal-api-gateway
    expose:
      - "8001"
    environment:
      - DATABASE_URL=postgresql://clubpal:clubpal@db:5432/clubpal_gateway
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@palstack.io}
      - FROM_NAME=${FROM_NAME:-clubPal}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:9000}
      - MINIO_ENDPOINT=garage:3900
      - MINIO_ACCESS_KEY=${GARAGE_ACCESS_KEY:-clubpal}
      - MINIO_SECRET_KEY=${GARAGE_SECRET_KEY:-clubpalpassword}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000/storage}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - OIDC_PROVIDERS=${OIDC_PROVIDERS:-}
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================
  # Groups Service — Groups, Members, Rotation
  # ===========================================
  groups-service:
    build: ./backend/services/groups-service
    container_name: clubpal-groups-service
    expose:
      - "8002"
    environment:
      - DATABASE_URL=postgresql://clubpal:clubpal@db:5432/clubpal_groups
      - MINIO_ENDPOINT=garage:3900
      - MINIO_ACCESS_KEY=${GARAGE_ACCESS_KEY:-clubpal}
      - MINIO_SECRET_KEY=${GARAGE_SECRET_KEY:-clubpalpassword}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000/storage}
      - MINIO_REGION=garage
      - GATEWAY_SERVICE_URL=http://api-gateway:8001
      - EVENTS_SERVICE_URL=http://events-service:8003
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================
  # Events Service — Events, Attendees, Comments
  # ===========================================
  events-service:
    build: ./backend/services/events-service
    container_name: clubpal-events-service
    expose:
      - "8003"
    environment:
      - DATABASE_URL=postgresql://clubpal:clubpal@db:5432/clubpal_events
      - MINIO_ENDPOINT=garage:3900
      - MINIO_ACCESS_KEY=${GARAGE_ACCESS_KEY:-clubpal}
      - MINIO_SECRET_KEY=${GARAGE_SECRET_KEY:-clubpalpassword}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000/storage}
      - GROUPS_SERVICE_URL=http://groups-service:8002
      - ACTIVITIES_SERVICE_URL=http://activities-service:8005
      - GATEWAY_URL=http://api-gateway:8001
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      groups-service:
        condition: service_healthy
      activities-service:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================
  # Ratings Service — Ratings, Stats, Leaderboard
  # ===========================================
  ratings-service:
    build: ./backend/services/ratings-service
    container_name: clubpal-ratings-service
    expose:
      - "8004"
    environment:
      - DATABASE_URL=postgresql://clubpal:clubpal@db:5432/clubpal_ratings
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      groups-service:
        condition: service_healthy
      events-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================
  # Activities Service — Activity Types, Categories
  # ===========================================
  activities-service:
    build: ./backend/services/activities-service
    container_name: clubpal-activities-service
    expose:
      - "8005"
    environment:
      - DATABASE_URL=postgresql://clubpal:clubpal@db:5432/clubpal_activities
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================
  # Enrichment Service — External API cache
  # ===========================================
  enrichment-service:
    build: ./backend/services/enrichment-service
    container_name: clubpal-enrichment-service
    expose:
      - "8006"
    environment:
      - DATABASE_URL=postgresql://clubpal:clubpal@db:5432/clubpal_enrichment
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID:-}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET:-}
      - MINIO_ENDPOINT=garage:3900
      - MINIO_ACCESS_KEY=${GARAGE_ACCESS_KEY:-clubpal}
      - MINIO_SECRET_KEY=${GARAGE_SECRET_KEY:-clubpalpassword}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000/storage}
      - MINIO_REGION=garage
      - CACHE_TTL_SEARCH=${CACHE_TTL_SEARCH:-86400}
      - CACHE_TTL_DETAIL=${CACHE_TTL_DETAIL:-604800}
      - CACHE_TTL_GEOCODE=${CACHE_TTL_GEOCODE:-2592000}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@palstack.io}
      - FROM_NAME=${FROM_NAME:-clubPal}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:9000}
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================
  # Bill Split Service — Receipt OCR, splits
  # ===========================================
  bill-split-service:
    build: ./backend/services/bill-split-service
    container_name: clubpal-bill-split-service
    expose:
      - "8007"
    environment:
      - DATABASE_URL=postgresql://clubpal:clubpal@db:5432/clubpal_billsplit
      - API_GATEWAY_URL=http://api-gateway:8001
      - EVENTS_SERVICE_URL=http://events-service:8003
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@palstack.io}
      - FROM_NAME=${FROM_NAME:-clubPal}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:9000}
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      events-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================
  # Backup — Postgres + Garage snapshots
  # ===========================================
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: clubpal-backup
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=clubpal
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-clubpal}
      - BACKUP_PG_SCHEDULE=${BACKUP_PG_SCHEDULE:-0 3 * * *}
      - BACKUP_STORAGE_SCHEDULE=${BACKUP_STORAGE_SCHEDULE:-0 4 * * *}
      - BACKUP_PG_RETENTION_DAYS=${BACKUP_PG_RETENTION_DAYS:-14}
      - BACKUP_STORAGE_RETENTION_DAYS=${BACKUP_STORAGE_RETENTION_DAYS:-7}
      - BACKUP_REMOTE_BUCKET=${BACKUP_REMOTE_BUCKET:-}
      - RCLONE_CONFIG_REMOTE_TYPE=${RCLONE_CONFIG_REMOTE_TYPE:-}
      - RCLONE_CONFIG_REMOTE_ACCOUNT=${RCLONE_CONFIG_REMOTE_ACCOUNT:-}
      - RCLONE_CONFIG_REMOTE_KEY=${RCLONE_CONFIG_REMOTE_KEY:-}
      - RCLONE_CONFIG_REMOTE_PROVIDER=${RCLONE_CONFIG_REMOTE_PROVIDER:-}
      - RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID=${RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID:-}
      - RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY=${RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY:-}
      - RCLONE_CONFIG_REMOTE_ENDPOINT=${RCLONE_CONFIG_REMOTE_ENDPOINT:-}
      - RCLONE_CONFIG_REMOTE_REGION=${RCLONE_CONFIG_REMOTE_REGION:-auto}
      - BACKUP_HEALTHCHECK_URL=${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      - garage_data:/garage-data:ro
      - backup_data:/backups
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

networks:
  clubpal-network:
    driver: bridge

volumes:
  pgdata:
  garage_cfg:
  garage_meta:
  garage_data:
  backup_data:
