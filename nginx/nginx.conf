# ClubPal Nginx Configuration
# Serves web UI and proxies API to backend microservices

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Upstream service definitions
    upstream api_gateway {
        server api-gateway:8001;
    }

    upstream groups_service {
        server groups-service:8002;
    }

    upstream events_service {
        server events-service:8003;
    }

    upstream ratings_service {
        server ratings-service:8004;
    }

    upstream activities_service {
        server activities-service:8005;
    }

    upstream enrichment_service {
        server enrichment-service:8006;
    }

    upstream minio {
        server minio:9000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=500r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Client body size limit
        client_max_body_size 10M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy headers (applied to all proxy_pass blocks)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ===========================================
        # API Gateway — /api/gateway/ → api-gateway:8001/
        # ===========================================
        location /api/gateway/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://api_gateway/;
        }

        # ===========================================
        # Groups Service — /api/groups/ → groups-service:8002/
        # ===========================================
        location /api/groups/ {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://groups_service/;
        }

        # ===========================================
        # Events Service — /api/events/ → events-service:8003/
        # ===========================================
        location /api/events/ {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://events_service/;
        }

        # ===========================================
        # Ratings Service — /api/ratings/ → ratings-service:8004/
        # ===========================================
        location /api/ratings/ {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://ratings_service/;
        }

        # ===========================================
        # Activities Service — /api/activities/ → activities-service:8005/
        # ===========================================
        location /api/activities/ {
            limit_req zone=general_limit burst=100 nodelay;
            proxy_pass http://activities_service/;
        }

        # ===========================================
        # Enrichment Service — /api/enrich/ → enrichment-service:8006/
        # ===========================================
        location /api/enrich/ {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://enrichment_service/;
            proxy_read_timeout 30s;
        }

        # ===========================================
        # MinIO Object Storage — /storage/ → minio:9000/
        # Host header MUST be minio:9000 so SigV4 presigned URL
        # signatures (signed with Host: minio:9000) remain valid.
        # CORS headers allow browser direct uploads (presigned PUT).
        # ^~ prevents the static-file regex (*.png etc.) from matching
        # upload paths before this proxy location can handle them.
        # ===========================================
        location ^~ /storage/ {
            # Handle CORS preflight (OPTIONS) sent before presigned PUT/GET
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, x-amz-*' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, x-amz-*' always;
            add_header 'Access-Control-Expose-Headers' 'ETag' always;

            proxy_pass http://minio/;
            proxy_set_header Host minio:9000;
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 50M;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ===========================================
        # Service Health Checks (Internal)
        # ===========================================
        location /internal/health/api-gateway {
            internal;
            proxy_pass http://api_gateway/health;
        }

        location /internal/health/groups {
            internal;
            proxy_pass http://groups_service/health;
        }

        location /internal/health/events {
            internal;
            proxy_pass http://events_service/health;
        }

        location /internal/health/ratings {
            internal;
            proxy_pass http://ratings_service/health;
        }

        location /internal/health/activities {
            internal;
            proxy_pass http://activities_service/health;
        }

        # ===========================================
        # API Documentation (Development)
        # ===========================================
        location /docs/auth {
            proxy_pass http://api_gateway/docs;
        }

        location /docs/groups {
            proxy_pass http://groups_service/docs;
        }

        location /docs/events {
            proxy_pass http://events_service/docs;
        }

        location /docs/ratings {
            proxy_pass http://ratings_service/docs;
        }

        location /docs/activities {
            proxy_pass http://activities_service/docs;
        }

        location /docs/enrich {
            proxy_pass http://enrichment_service/docs;
        }

        # ===========================================
        # Web UI — Serve React SPA (must be last)
        # ===========================================
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ===========================================
        # Error Pages
        # ===========================================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"detail": "Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }

        access_log /var/log/nginx/clubpal-access.log;
        error_log /var/log/nginx/clubpal-error.log warn;
    }
}
