name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Only push images on main branch merges, not on PRs
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}
  # GHCR requires lowercase owner — github.repository_owner preserves original casing
  OWNER: ${{ github.repository_owner }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Nginx — multi-stage build: Node 20 compiles the React web UI,
  # then Nginx 1.25 serves it. Context must be repo root to access web/ and nginx/.
  # ──────────────────────────────────────────────────────────────────────────
  build-nginx:
    name: Build nginx + web UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nginx/Dockerfile
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/clubpal-nginx:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/clubpal-nginx:${{ github.sha }}
          no-cache: true

  # ──────────────────────────────────────────────────────────────────────────
  # Backend microservices — matrix runs all six in parallel
  # ──────────────────────────────────────────────────────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - groups-service
          - events-service
          - ratings-service
          - activities-service
          - enrichment-service
          - bill-split-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: backend/services/${{ matrix.service }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/clubpal-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/clubpal-${{ matrix.service }}:${{ github.sha }}
          no-cache: true
