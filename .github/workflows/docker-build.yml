name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Only push images on main branch merges, not on PRs
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Nginx — multi-stage build: Node 20 compiles the React web UI,
  # then Nginx 1.25 serves it. Context must be repo root to access web/ and nginx/.
  # ──────────────────────────────────────────────────────────────────────────
  build-nginx:
    name: Build nginx + web UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nginx/Dockerfile
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/clubpal-nginx:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/clubpal-nginx:${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Backend microservices — matrix runs all six in parallel
  # ──────────────────────────────────────────────────────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - groups-service
          - events-service
          - ratings-service
          - activities-service
          - enrichment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: backend/services/${{ matrix.service }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/clubpal-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/clubpal-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
