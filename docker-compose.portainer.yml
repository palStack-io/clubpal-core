# =============================================================================
# clubPal — Portainer Stack (Plug-and-Play)
# =============================================================================
# Drop this file directly into Portainer → Stacks → Add Stack → Web editor.
# Images are pulled from GitHub Container Registry:
#   https://github.com/palStack-io/clubpal-core/pkgs/container
#
# Log in to GHCR first (only needed if packages are private):
#   echo $GITHUB_TOKEN | docker login ghcr.io -u palstack-io --password-stdin
#
# BEFORE DEPLOYING:
#   1. Replace every  CHANGEME  value with your own secret / key.
#   2. Update APP_HOST to your server's public domain or IP.
#   3. Generate required Garage secrets:
#        CHANGEME_GARAGE_RPC  →  openssl rand -hex 32
#        CHANGEME_GARAGE_SECRET → openssl rand -base64 32
#   4. Optional env vars (SMTP, OAuth, external APIs) can be left blank —
#      features that need them will simply be disabled at runtime.
#
# IMAGE TAGS
#   Pin a specific release by changing &tag below, e.g. "abc1234"
# =============================================================================

# ---------------------------------------------------------------------------
# Change these two lines — everything else derives from them.
# ---------------------------------------------------------------------------
x-registry:  &registry   "ghcr.io/palstack-io"        # GHCR owner (lowercase)
x-tag:       &tag         "latest"                     # ← image tag (or SHA)
x-app-host:  &app-host    "http://your-server-ip:9000" # ← public URL (no trailing slash)
# ---------------------------------------------------------------------------

services:

  # ===========================================================================
  # PostgreSQL — single shared instance, 7 isolated databases
  # ===========================================================================
  db:
    image: postgres:15-alpine
    container_name: clubpal-db
    environment:
      POSTGRES_USER: clubpal
      POSTGRES_PASSWORD: CHANGEME_DB_PASSWORD    # ← required
      POSTGRES_DB: clubpal
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - clubpal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubpal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # DB Init — creates all per-service databases (runs once after postgres ready)
  # ===========================================================================
  db-init:
    image: postgres:15-alpine
    container_name: clubpal-db-init
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: CHANGEME_DB_PASSWORD           # ← must match db above
    entrypoint: >
      /bin/sh -c "
      for db in clubpal_gateway clubpal_groups clubpal_events clubpal_ratings clubpal_activities clubpal_enrichment clubpal_billsplit; do
        psql -h db -U clubpal -tc \"SELECT 1 FROM pg_database WHERE datname='$$db'\" | grep -q 1 ||
        psql -h db -U clubpal -c \"CREATE DATABASE $$db\";
      done"
    restart: on-failure

  # ===========================================================================
  # Garage — S3-compatible object storage (avatars, event photos, enrichment cache)
  # ===========================================================================
  garage:
    image: dxflrs/garage:v1.0.0
    container_name: clubpal-garage
    environment:
      GARAGE_RPC_SECRET: CHANGEME_GARAGE_RPC     # ← openssl rand -hex 32
      GARAGE_ACCESS_KEY: clubpal
      GARAGE_SECRET_KEY: CHANGEME_GARAGE_SECRET  # ← openssl rand -base64 32
    entrypoint: >
      /bin/sh -c "
      cat > /etc/garage.toml << 'TOML'
      metadata_dir = \"/var/lib/garage/meta\"
      data_dir = \"/var/lib/garage/data\"
      replication_factor = 1

      [rpc]
      secret = \"PLACEHOLDER_RPC\"
      bind_addr = \"0.0.0.0:3901\"
      public_addr = \"garage:3901\"

      [s3_api]
      s3_region = \"garage\"
      api_bind_addr = \"0.0.0.0:3900\"
      root_domain = \".s3.localhost\"

      [s3_web]
      bind_addr = \"0.0.0.0:3902\"
      root_domain = \".web.localhost\"
      index = \"index.html\"

      [admin]
      api_bind_addr = \"0.0.0.0:3903\"
      TOML
      sed -i \"s/PLACEHOLDER_RPC/$$GARAGE_RPC_SECRET/\" /etc/garage.toml &&
      exec /garage server"
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - clubpal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3903/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  garage-setup:
    image: python:3.12-alpine
    container_name: clubpal-garage-setup
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - clubpal-network
    environment:
      GARAGE_ACCESS_KEY: clubpal
      GARAGE_SECRET_KEY: CHANGEME_GARAGE_SECRET  # ← must match garage above
    entrypoint: >
      /bin/sh -c "
      pip install requests -q &&
      python3 -c \"
      import os, time, requests, sys
      ADMIN = 'http://garage:3903'
      KEY = os.environ['GARAGE_ACCESS_KEY']
      SECRET = os.environ['GARAGE_SECRET_KEY']
      for i in range(30):
          try:
              if requests.get(f'{ADMIN}/health', timeout=2).status_code == 200: break
          except: pass
          time.sleep(2)
      else:
          print('Garage not ready', file=sys.stderr); sys.exit(1)
      status = requests.get(f'{ADMIN}/v1/status').json()
      node_id = next(iter(status.get('nodes', {})))
      print(f'Node: {node_id}')
      requests.post(f'{ADMIN}/v1/layout', json={node_id: {'zone': 'dc1', 'capacity': 10000000000}})
      layout = requests.get(f'{ADMIN}/v1/layout').json()
      version = layout.get('version', 0) + 1
      requests.post(f'{ADMIN}/v1/layout/apply', json={'version': version})
      print(f'Layout v{version} applied')
      r = requests.post(f'{ADMIN}/v1/key', json={'name': 'main', 'importKeyId': KEY, 'importSecretKey': SECRET})
      print(f'Key: {r.status_code}')
      for name in ['clubpal-avatars', 'clubpal-events', 'clubpal-cache']:
          r = requests.post(f'{ADMIN}/v1/bucket', json={'globalAlias': name})
          bid = r.json().get('id') or requests.get(f'{ADMIN}/v1/bucket', params={'globalAlias': name}).json()['id']
          requests.post(f'{ADMIN}/v1/bucket/allow', json={'bucketId': bid, 'accessKeyId': KEY, 'read': True, 'write': True, 'owner': True})
          print(f'Bucket {name} ready')
      print('Done')
      \""
    restart: on-failure

  # ===========================================================================
  # Nginx — Web UI + reverse proxy (single public entry point on port 9000)
  # ===========================================================================
  nginx:
    image: ghcr.io/palstack-io/clubpal-nginx:latest
    container_name: clubpal-nginx
    ports:
      - "9000:80"
    volumes:
      - ./nginx/logs:/var/log/nginx
    networks:
      - clubpal-network
    depends_on:
      - api-gateway
      - groups-service
      - events-service
      - ratings-service
      - activities-service
      - enrichment-service
      - bill-split-service
      - garage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # API Gateway — auth, users, sessions, invites, notifications, OIDC
  # ===========================================================================
  api-gateway:
    image: ghcr.io/palstack-io/clubpal-api-gateway:latest
    container_name: clubpal-api-gateway
    expose:
      - "8001"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://clubpal:CHANGEME_DB_PASSWORD@db:5432/clubpal_gateway

      # ── Garage (S3-compatible) ─────────────────────────────────────────────
      MINIO_ENDPOINT: garage:3900
      MINIO_ACCESS_KEY: clubpal
      MINIO_SECRET_KEY: CHANGEME_GARAGE_SECRET
      MINIO_PUBLIC_URL: http://your-server-ip:9000/storage  # ← public URL

      # ── App URLs ──────────────────────────────────────────────────────────
      FRONTEND_URL: http://your-server-ip:9000              # ← public URL

      # ── Email / SMTP (leave blank to disable email features) ──────────────
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ""                   # your-email@gmail.com
      SMTP_PASSWORD: ""               # app password / SMTP credential
      FROM_EMAIL: noreply@yourapp.io
      FROM_NAME: clubPal

      # ── Internal service secret (any random string ≥ 32 chars) ────────────
      INTERNAL_API_SECRET: CHANGEME_INTERNAL_SECRET

      # ── Admin (leave blank — defaults to first admin user's email) ───────
      ADMIN_EMAIL: ""

      # ── OAuth / OIDC (optional — leave blank to disable) ──────────────────
      GOOGLE_CLIENT_ID: ""
      OIDC_PROVIDERS: ""              # JSON array of OIDC provider configs
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # Groups Service — groups, members, rotation, polls
  # ===========================================================================
  groups-service:
    image: ghcr.io/palstack-io/clubpal-groups-service:latest
    container_name: clubpal-groups-service
    expose:
      - "8002"
    environment:
      DATABASE_URL: postgresql://clubpal:CHANGEME_DB_PASSWORD@db:5432/clubpal_groups
      MINIO_ENDPOINT: garage:3900
      MINIO_ACCESS_KEY: clubpal
      MINIO_SECRET_KEY: CHANGEME_GARAGE_SECRET
      MINIO_PUBLIC_URL: http://your-server-ip:9000/storage  # ← public URL
      GATEWAY_SERVICE_URL: http://api-gateway:8001
      EVENTS_SERVICE_URL: http://events-service:8003
      INTERNAL_API_SECRET: CHANGEME_INTERNAL_SECRET
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # Events Service — events, RSVPs, comments, photos, recurring schedules
  # ===========================================================================
  events-service:
    image: ghcr.io/palstack-io/clubpal-events-service:latest
    container_name: clubpal-events-service
    expose:
      - "8003"
    environment:
      DATABASE_URL: postgresql://clubpal:CHANGEME_DB_PASSWORD@db:5432/clubpal_events
      MINIO_ENDPOINT: garage:3900
      MINIO_ACCESS_KEY: clubpal
      MINIO_SECRET_KEY: CHANGEME_GARAGE_SECRET
      MINIO_PUBLIC_URL: http://your-server-ip:9000/storage  # ← public URL
      GROUPS_SERVICE_URL: http://groups-service:8002
      ACTIVITIES_SERVICE_URL: http://activities-service:8005
      GATEWAY_URL: http://api-gateway:8001
      INTERNAL_API_SECRET: CHANGEME_INTERNAL_SECRET
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      groups-service:
        condition: service_healthy
      activities-service:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # Ratings Service — ratings, leaderboards, user stats
  # ===========================================================================
  ratings-service:
    image: ghcr.io/palstack-io/clubpal-ratings-service:latest
    container_name: clubpal-ratings-service
    expose:
      - "8004"
    environment:
      DATABASE_URL: postgresql://clubpal:CHANGEME_DB_PASSWORD@db:5432/clubpal_ratings
      GROUPS_SERVICE_URL: http://groups-service:8002
      EVENTS_SERVICE_URL: http://events-service:8003
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      groups-service:
        condition: service_healthy
      events-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # Activities Service — activity types, categories, search
  # ===========================================================================
  activities-service:
    image: ghcr.io/palstack-io/clubpal-activities-service:latest
    container_name: clubpal-activities-service
    expose:
      - "8005"
    environment:
      DATABASE_URL: postgresql://clubpal:CHANGEME_DB_PASSWORD@db:5432/clubpal_activities
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # Enrichment Service — external API cache (Google Places, TMDB, IGDB, Books)
  # ===========================================================================
  enrichment-service:
    image: ghcr.io/palstack-io/clubpal-enrichment-service:latest
    container_name: clubpal-enrichment-service
    expose:
      - "8006"
    environment:
      DATABASE_URL: postgresql://clubpal:CHANGEME_DB_PASSWORD@db:5432/clubpal_enrichment
      MINIO_ENDPOINT: garage:3900
      MINIO_ACCESS_KEY: clubpal
      MINIO_SECRET_KEY: CHANGEME_GARAGE_SECRET
      MINIO_PUBLIC_URL: http://your-server-ip:9000/storage  # ← public URL
      INTERNAL_API_SECRET: CHANGEME_INTERNAL_SECRET

      # ── App URLs ──────────────────────────────────────────────────────────
      FRONTEND_URL: http://your-server-ip:9000              # ← public URL

      # ── Email / SMTP (leave blank to disable email features) ──────────────
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      FROM_EMAIL: noreply@yourapp.io
      FROM_NAME: clubPal

      # ── Admin alert recipient ────────────────────────────────────────────
      ADMIN_EMAIL: ""

      # ── External API keys (leave blank to disable that search type) ────────
      GOOGLE_API_KEY: ""              # Google Places + Books + Geocoding
      TMDB_API_KEY: ""               # Movie / TV search
      IGDB_CLIENT_ID: ""             # Video game search (Twitch app)
      IGDB_CLIENT_SECRET: ""

      # ── Cache TTLs (seconds) ───────────────────────────────────────────────
      CACHE_TTL_SEARCH: "86400"      # 24 h
      CACHE_TTL_DETAIL: "604800"     # 7 days
      CACHE_TTL_GEOCODE: "2592000"   # 30 days
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # Bill Split Service — receipt OCR, bill splitting, settlement emails
  # ===========================================================================
  bill-split-service:
    image: ghcr.io/palstack-io/clubpal-bill-split-service:latest
    container_name: clubpal-bill-split-service
    expose:
      - "8007"
    environment:
      DATABASE_URL: postgresql://clubpal:CHANGEME_DB_PASSWORD@db:5432/clubpal_billsplit
      API_GATEWAY_URL: http://api-gateway:8001
      EVENTS_SERVICE_URL: http://events-service:8003
      INTERNAL_API_SECRET: CHANGEME_INTERNAL_SECRET

      # ── App URL (used in payment confirmation email links) ─────────────────
      FRONTEND_URL: http://your-server-ip:9000              # ← public URL

      # ── Email / SMTP (leave blank to disable email features) ──────────────
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      FROM_EMAIL: noreply@yourapp.io
      FROM_NAME: clubPal
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      events-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # Backup — Postgres + Garage snapshots → optional remote storage
  # Runs on cron inside the container (supercronic). No host cron needed.
  # ===========================================================================
  backup:
    image: ghcr.io/palstack-io/clubpal-backup:latest
    container_name: clubpal-backup
    environment:
      # ── Postgres connection ──────────────────────────────────────────────
      POSTGRES_HOST: db
      POSTGRES_USER: clubpal
      POSTGRES_PASSWORD: CHANGEME_DB_PASSWORD    # ← must match db above

      # ── Cron schedules (UTC) ────────────────────────────────────────────
      BACKUP_PG_SCHEDULE: "0 3 * * *"            # daily at 03:00 UTC
      BACKUP_STORAGE_SCHEDULE: "0 4 * * *"       # daily at 04:00 UTC

      # ── Local retention ─────────────────────────────────────────────────
      BACKUP_PG_RETENTION_DAYS: "14"
      BACKUP_STORAGE_RETENTION_DAYS: "7"

      # ── Remote storage (leave BACKUP_REMOTE_BUCKET blank = local only) ──
      BACKUP_REMOTE_BUCKET: ""                   # e.g. my-backup-bucket

      # Option A — Backblaze B2
      RCLONE_CONFIG_REMOTE_TYPE: ""              # set to: b2
      RCLONE_CONFIG_REMOTE_ACCOUNT: ""           # B2 account ID
      RCLONE_CONFIG_REMOTE_KEY: ""               # B2 application key

      # Option B — Cloudflare R2 / AWS S3 (uncomment and fill in)
      # RCLONE_CONFIG_REMOTE_TYPE: s3
      # RCLONE_CONFIG_REMOTE_PROVIDER: Cloudflare   # or: AWS
      # RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ""
      # RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ""
      # RCLONE_CONFIG_REMOTE_ENDPOINT: ""            # R2 only
      # RCLONE_CONFIG_REMOTE_REGION: auto

      # ── Dead man's switch ping after each successful backup (optional) ───
      BACKUP_HEALTHCHECK_URL: ""                 # e.g. https://hc-ping.com/xxx
    volumes:
      - garage_data:/garage-data:ro
      - /media/harungunasekaran/raid1Copy/palStack/clubpal:/backups
    networks:
      - clubpal-network
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
networks:
  clubpal-network:
    driver: bridge

volumes:
  pgdata:
  garage_meta:
  garage_data:
